name: CI / CD

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

jobs:
  # ── Lint (runs on every push to any branch) ─────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

  # ── Dependency audit ────────────────────────────────────────────────────────
  # Two passes:
  #   1. Production deps at HIGH severity — FAILS the build. Real risk.
  #   2. All deps at MODERATE — warn-only, surfaces transitive low-severity
  #      issues without blocking shipping.
  audit:
    name: npm audit
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Audit production deps (high+ — BLOCKS on fail)
        run: npm audit --omit=dev --audit-level=high

      - name: Audit all deps incl. dev (moderate — warn only)
        run: npm audit --audit-level=moderate
        continue-on-error: true

  # ── Build verification (runs on every push to any branch) ──────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          # No real key needed for build — proxy is server-side only
          OPENAI_API_KEY: ''

      - name: Bundle size budget gate
        run: npm run bundle:budget

      - name: Upload source maps to Sentry
        if: env.SENTRY_AUTH_TOKEN != '' && env.SENTRY_ORG != '' && env.SENTRY_PROJECT != ''
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG:        ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT:    ${{ secrets.SENTRY_PROJECT }}
        run: |
          npx @sentry/cli releases new "$GITHUB_SHA"
          npx @sentry/cli releases set-commits "$GITHUB_SHA" --auto
          npx @sentry/cli sourcemaps inject ./dist
          npx @sentry/cli sourcemaps upload --release="$GITHUB_SHA" ./dist
          npx @sentry/cli releases finalize "$GITHUB_SHA"
          # Strip .map files from dist before they ship to Render (sourcemaps
          # are now in Sentry; we don't need them publicly fetchable).
          find ./dist -name "*.map" -delete

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  # ── Deploy to Render (runs only on push to main after build passes) ─────────
  deploy:
    name: Deploy → Render
    needs: build
    runs-on: ubuntu-latest
    # Runs on push to main. The deploy-hook step self-skips if the secret is
    # absent (guarded at STEP level, where `env` context is legal — job-level
    # `if` cannot reference `env` or `secrets`).
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Trigger Render deploy hook (skips if secret unset)
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "RENDER_DEPLOY_HOOK_URL not set — Render's native GitHub auto-deploy handles this. Skipping."
            exit 0
          fi
          curl --silent --show-error --fail -X POST "$RENDER_DEPLOY_HOOK_URL"

  # ── Smoke test after deploy (warn-only until SMOKE_* secrets configured) ────
  smoke:
    name: Smoke test (prod)
    needs: deploy
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    continue-on-error: true
    env:
      SMOKE_BASE:               https://mulbros-marketing-os.onrender.com
      SMOKE_STYTCH_TOKEN:       ${{ secrets.SMOKE_STYTCH_TOKEN }}
      SMOKE_USER_ID:            ${{ secrets.SMOKE_USER_ID }}
      VITE_SUPABASE_URL:        ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY:   ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      SUPABASE_JWT_SECRET:      ${{ secrets.SUPABASE_JWT_SECRET }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Wait for Render to finish deploying
        run: |
          for i in 1 2 3 4 5 6; do
            sleep 25
            curl -s --fail "$SMOKE_BASE/healthz" | grep -q '"status":"ok"' && exit 0 || true
          done
          echo "/healthz did not return 200 within ~150s"
          exit 1

      - name: Run smoke
        run: |
          if [ -z "$SMOKE_STYTCH_TOKEN" ] || [ -z "$SMOKE_USER_ID" ]; then
            echo "SMOKE_* secrets not configured — skipping. Add SMOKE_STYTCH_TOKEN + SMOKE_USER_ID + VITE_SUPABASE_URL + VITE_SUPABASE_ANON_KEY + SUPABASE_JWT_SECRET to GitHub repo secrets to enable."
            exit 0
          fi
          npm run smoke:prod
